name: Update PID Shards

on:
  schedule:
    - cron: '30 16 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gallery-dl
        run: pip install gallery-dl

      - name: Fetch artist index
        env:
          GALLERY_DL_OAUTH_PIXIV_REFRESH_TOKEN: ${{ secrets.PIXIV_REFRESH_TOKEN }}
        run: |
          gallery-dl --get-urls "https://www.pixiv.net/users/100193539/following" \
            | grep -oP 'users/\K\d+' | sort -u > artists_index.txt

      - name: Fetch works per artist and build reverse index
        env:
          GALLERY_DL_OAUTH_PIXIV_REFRESH_TOKEN: ${{ secrets.PIXIV_REFRESH_TOKEN }}
        run: |
          mkdir -p data/artists data/pid
          while read artist_id; do
            [ -z "$artist_id" ] && continue
            echo ">> Processing artist $artist_id"
            gallery-dl --get-urls --no-download \
              "https://www.pixiv.net/users/$artist_id" \
              | grep -oP '/(\d+)_p\d+' | cut -d/ -f2 | sort -u \
              > "data/artists/$artist_id.json"
            python3 scripts/build_pid_index.py "data/artists/$artist_id.json" "data/pid"
            sleep 3
          done < artists_index.txt

      - name: Generate pid index list
        run: |
          ls data/pid/ | sed 's/\.json$//' > data/pid_index.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add artists_index.txt data/
          git diff --staged --quiet || git commit -m "Update PID shards $(date -u +'%F %T')"
          git push