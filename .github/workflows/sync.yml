name: Update PID Shards and Date Maps

on:
  schedule:
    - cron: '30 13 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gallery-dl
        run: pip install gallery-dl

      - name: Run full update script
        env:
          PIXIV_REFRESH_TOKEN: ${{ secrets.PIXIV_REFRESH_TOKEN }}
          PIXIV_COOKIE: ${{ secrets.PIXIV_COOKIE }}
          PIXIV_USER_ID: ${{ secrets.PIXIV_USER_ID }}
        run: python3 scripts/build_all.py

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add artists_index.txt data/ scripts/
          git diff --staged --quiet || git commit -m "Update shards $(date -u +'%F %T')"
          git push