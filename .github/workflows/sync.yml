name: Update PID Shards
on:
  schedule:
    - cron: '30 16 * * *'   # 北京时间 0:30
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gallery-dl
        run: pip install gallery-dl

      - name: Fetch artist index
        env:
          PIXIV_REFRESH_TOKEN: ${{ secrets.PIXIV_REFRESH_TOKEN }}
          PIXIV_USER_ID: ${{ secrets.PIXIV_USER_ID }}
        run: |
          gallery-dl --oauth-token "$PIXIV_REFRESH_TOKEN" \
            --get-urls "https://www.pixiv.net/users/$PIXIV_USER_ID/following" \
            | grep -oP 'users/\K\d+' | sort -u > artists_index.txt

      - name: Fetch works per artist and build reverse index
        env:
          PIXIV_REFRESH_TOKEN: ${{ secrets.PIXIV_REFRESH_TOKEN }}
        run: |
          mkdir -p data/artists data/pid
          while read artist_id; do
            [ -z "$artist_id" ] && continue
            echo ">> Processing artist $artist_id"
            gallery-dl --oauth-token "$PIXIV_REFRESH_TOKEN" \
              --get-urls --no-download \
              "https://www.pixiv.net/users/$artist_id" \
              | grep -oP '/(\d+)_p\d+' | cut -d/ -f2 | sort -u \
              > "data/artists/$artist_id.json"
            python3 -c "
import json, sys
from collections import defaultdict
pid_pages = defaultdict(list)
with open('data/artists/$artist_id.json') as f:
    for line in f:
        line = line.strip()
        if '_' not in line: continue
        pid, page = line.split('_', 1)
        pid_pages[pid].append(page)
for pid, pages in pid_pages.items():
    with open(f'data/pid/{pid}.json', 'w') as fout:
        json.dump(sorted(pages), fout)
"
            sleep 3
          done < artists_index.txt

      - name: Generate pid index for Worker
        run: |
          ls data/pid/ | sed 's/\.json$//' > data/pid_index.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add artists_index.txt data/
          git diff --staged --quiet || git commit -m "Update PID shards $(date -u +'%F %T')"
          git push